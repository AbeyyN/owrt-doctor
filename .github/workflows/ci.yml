name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck files/usr/bin/owrt-doctor
          shellcheck files/usr/lib/owrt-doctor/checks.d/*.sh
          shellcheck tests/run.sh

      - name: Tests
        run: sh tests/run.sh
